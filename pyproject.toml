[project]
name = "llm-conflict-probing"
version = "0.1.0"
description = "Probing for internal value-conflict states in LLM residual streams"
requires-python = ">=3.12"
dependencies = [
    # --- core ML stack (pinned to the known-good cu128 pair) ---
    "torch==2.11.0",
    # "torchvision==0.26.0",          # remove if you hit the torchvision::nms error and don't need vision
    "transformers==5.12.0",
    "transformer-lens==3.4.0",
    "accelerate==1.14.0",
    "huggingface-hub==1.19.0",
    "safetensors==0.8.0",
    "sentencepiece==0.2.1",         # Gemma tokenizer backend
    "tokenizers==0.22.2",
    "datasets==5.0.0",

    # --- analysis ---
    "scikit-learn==1.9.0",
    "scipy==1.17.1",
    "numpy==2.4.4",
    "pandas==3.0.3",
    "matplotlib==3.11.0",
    "seaborn==0.13.2",

    # --- notebook / tooling ---
    "jupyterlab==4.5.8",
    "ipykernel==7.3.0",
    "ipywidgets",                   # not in the prior env; added for tqdm progress bars
    "nbformat==5.10.4",
    "tqdm==4.68.2",
    "python-dotenv==1.2.2",

    # --- experiment tracking (optional; was present in prior env) ---
    "wandb==0.27.2",
]

# Bind torch + torchvision to the PyTorch CUDA 12.8 wheel index so they never
# silently resolve to a CPU build from PyPI. This is the line that stops the
# desyncing that broke the environment repeatedly.
[tool.uv.sources]
torch = { index = "pytorch-cu128" }
# torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true   # used ONLY for packages bound above; everything else stays on PyPI

# --- Phase 5 (SAE decomposition) — uncomment when you get there ---
# Add to dependencies above:
#   "sae-lens",
# SAE-Lens pulls its own torch-adjacent deps; add it via `uv add sae-lens`
# so uv resolves it against the pinned torch rather than bumping torch.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
